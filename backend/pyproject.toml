[project]
name = "grantgate-backend"
version = "1.0.0"
description = "GrantGate Secure Model & Dataset Access Governance Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "namoid>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "hypothesis>=6.98.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ec(code): mark test as covering an edge-case ID from the blueprint",
]

[tool.mypy]
strict = false

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true
